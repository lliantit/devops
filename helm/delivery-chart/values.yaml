replicaCount: 1

image:
  repository: delivery-api
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "150m"
    memory: "128Mi"

config:
  port: "3000"
  nodeEnv: "development"

secret:
  mongoDatabase: "delivery"

mongodb:
  image: "mongo:6.0"
  port: 27017
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  pvc:
    enabled: true
    storage: 1Gi
    accessMode: ReadWriteOnce

ingress:
  enabled: false
  host: delivery.local