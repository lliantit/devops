apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "delivery-chart.fullname" . }}-pre-upgrade
  labels:
    {{- include "delivery-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: pre-upgrade-check
          image: busybox:1.36
          command: ['sh', '-c', 'echo "Pre-upgrade check passed for release {{ .Release.Name }}" && sleep 2']