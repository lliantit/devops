apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "delivery-chart.fullname" . }}-mongo
  labels:
    {{- include "delivery-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "delivery-chart.name" . }}-mongo
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "delivery-chart.name" . }}-mongo
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: mongo
          image: {{ .Values.mongodb.image }}
          ports:
            - containerPort: {{ .Values.mongodb.port }}
          resources:
            {{- toYaml .Values.mongodb.resources | nindent 12 }}
          {{- if .Values.mongodb.pvc.enabled }}
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
          {{- end }}
      {{- if .Values.mongodb.pvc.enabled }}
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: {{ include "delivery-chart.fullname" . }}-mongo-pvc
      {{- end }}