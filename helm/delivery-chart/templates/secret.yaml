{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "delivery-chart.fullname" . }}-secret
  labels:
    {{- include "delivery-chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGO_URI: {{ printf "mongodb://%s-mongo:%v/%s" (include "delivery-chart.fullname" .) .Values.mongodb.port .Values.secret.mongoDatabase | quote }}
  {{- end }}