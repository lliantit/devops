apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "delivery-chart.fullname" . }}-api
  labels:
    {{- include "delivery-chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "delivery-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "delivery-chart.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: delivery-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "delivery-chart.fullname" . }}-config
                  key: PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "delivery-chart.fullname" . }}-config
                  key: NODE_ENV
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | default (printf "%s-secret" (include "delivery-chart.fullname" .)) }}
                  key: MONGO_URI
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5