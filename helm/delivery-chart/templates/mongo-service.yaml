apiVersion: v1
kind: Service
metadata:
  name: {{ include "delivery-chart.fullname" . }}-mongo
  labels:
    {{- include "delivery-chart.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "delivery-chart.name" . }}-mongo
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.mongodb.port }}
      targetPort: {{ .Values.mongodb.port }}