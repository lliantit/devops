replicaCount: 1

image:
  repository: delivery-api
  tag: "1.0.0"
  pullPolicy: IfNotPresent

existingSecret: delivery-secret

config:
  port: "3000"
  nodeEnv: "development"

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "150m"
    memory: "128Mi"

ingress:
  enabled: false